databaseChangeLog:
  - changeSet:
      id: 1
      author: DevKarmanov
      comment: Adding a unique name and email constraint
      changes:
        - addUniqueConstraint:
            tableName: users
            columnNames: name, email
            constraintName: uk_users_name_email

  - changeSet:
      id: 2
      author: DevKarmanov
      comment: Creating the necessary uuid-ossp and pgcrypto extensions
      changes:
        - sql:
            sql: 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
        - sql:
            sql: 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'

  - changeSet:
      id: 3
      author: DevKarmanov
      comment: Adding a test user
      changes:
        - sql:
            sql: |
              INSERT INTO users(id, name, password, email, created_at)
              VALUES (
                uuid_generate_v4(),
                'test-user',
                crypt('password', gen_salt('bf')),
                'mail@example.com',
                NOW()
              )
              ON CONFLICT ON CONSTRAINT uk_users_name_email DO NOTHING;
